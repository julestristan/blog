name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/blog

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            HUGO_BASEURL=https://julestristan.fr/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tourne SUR le serveur (runner self-hosted) : pas de SSH entrant à ouvrir.
  deploy:
    needs: build
    runs-on: [self-hosted, blog]
    steps:
      - name: Déploiement
        working-directory: ${{ vars.BLOG_DIR || '/home/tristan/blog' }}
        run: |
          git pull --ff-only
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
