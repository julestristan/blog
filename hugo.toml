baseURL = "https://julestristan.fr/"
languageCode = "fr-fr"
title = "Tristan Jules"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 8

[minify]
  disableXML = true

[params]
  defaultTheme = "light"
  ShowPostNavLinks = true
  ShowWordCount = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "Tristan Jules"
    Content = "Actuellement alternant et intéressé par **Data Engineer & DevOps** ⚙️ J'apprends en construisant : mon propre VPS, Docker, la CI/CD, le cloud et la donnée. Ici, je partage mes notes, mes galères et ce qui a fini par marcher."
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/julestristan"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:tristanjules7@gmail.com"

[[menu.main]]
  identifier = "posts"
  name = "Articles"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "À propos"
  url = "/about/"
  weight = 20

[markup.highlight]
  noClasses = false
  style = "onedark"
