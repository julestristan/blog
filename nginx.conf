server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Assets statiques : cache long (Hugo versionne le CSS/JS)
    location ~* \.(css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Pas d'exposition d'infos serveur superflues
    server_tokens off;
}
